# Test fixtures for the gate: PostgreSQL and a JetStream-enabled NATS. The service itself is not
# part of this file. To run it against these fixtures, set at least:
#
#   RATATOSKR__STORAGE__DATABASE_URL=postgres://instagram:instagram@127.0.0.1:5436/instagram
#   RATATOSKR__BUS__URL=nats://127.0.0.1:14225
#   RATATOSKR__PUBLIC_RESOLUTION__ACCESS_TOKEN_PATH=/absolute/path/to/a/file/with/the/meta/app/token
#
# The access-token path is required whenever the bus is set (the process exits 78 without it).
# Optional: RATATOSKR__PUBLIC_RESOLUTION__{ENDPOINT,MAX_ATTEMPTS,BATCH_SIZE,POLL_INTERVAL_MS}.
# A bare `nats -js` accepts any publish; the deployed ACL is platform/deploy/nats/ratatoskr.conf.
services:
  nats:
    image: nats:2-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    container_name: ratatoskr-instagram-nats
    command: ["-js"]
    ports:
      - "127.0.0.1:14225:4222"

  postgres:
    image: postgres:17
    container_name: ratatoskr-instagram-postgres
    environment:
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: instagram
      POSTGRES_DB: instagram
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instagram -d instagram && psql -U instagram -d instagram -c 'select 1' > /dev/null"]
      interval: 1s
      timeout: 5s
      retries: 30
