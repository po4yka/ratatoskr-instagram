schema: spec-driven

references:
  - { id: ratatoskr-workspace, remote: "git@github.com:po4yka/ratatoskr-workspace.git" }

context: |
  `ratatoskr-instagram` — The Instagram account and capture bounded context. It combines official account access where available with explicit user-initiated captures, public oEmbed resolution and versioned Data Export imports.

  Stack: Rust/Tokio, Reqwest/Rustls, OAuth, SQLx/PostgreSQL, safe archive import, BlobStore, NATS, provider fixtures and WireMock, tracing, testcontainers.

  Implementation plan items 1-3 are implemented: the `ratatoskr-instagram-archive` service with typed strict configuration (`RATATOSKR__` environment prefix), structured telemetry, operator health routes, typed errors, and the first-version `schema.sql` defining the owned `instagram_archive` schema; plus explicit capture intake — permalink canonicalization, idempotent capture identity on `(user_ref, canonical_url)`, truthful unavailable fallback, and `POST /v1/captures` on a second loopback product listener. Its product gate lives in .github/workflows/ci.yml; DEVELOPMENT.md documents the same command list, and a drift guard fails when the two disagree. Public resolution, Data Export import, eventing, and account connection remain planned (items 4-10).

  Development status, binding and overriding anything that plans otherwise: one version only — no v2, no version negotiation, no deprecation window; no database migrations — a schema change edits schema.sql in place and test databases are created from it; the product is Ratatoskr and never "Ratatoskr Next". Only the repository owner changes this status.

  Behaviour visible to more than one repository belongs in the ratatoskr-workspace store, not here.

  Artefacts are written in English.

rules:
  specs:
    - Every scenario must be executable as a test. If you cannot name the test it becomes, the
      scenario is too vague to accept.
    - Scenarios use WHEN and THEN. State the observable outcome, never the implementation that
      produces it.
  tasks:
    - A task that changes behaviour is a pair. The first task adds a test that fails. The second
      makes it pass. Never one task that does both.
    - The failing-test task names the file, the test name, and the assertion that must fail.
    - A refactor task comes only after the tests are green. It adds no test and changes no behaviour.
    - A task that cannot start from a failing test states why in one line. Configuration,
      documentation and generated files are the usual reasons.

operations:
  apply:
    guidance:
      - Run the new test before you write the implementation. Confirm it fails for the reason the
        task states, and not for a compile error or a typo.
      - Run the current docs-only command list in this repository's DEVELOPMENT.md before the change
        is complete. The first product manifest adds a product gate alongside these unchanged
        OpenSpec checks. .github/workflows/fleet.yml checks for a test invocation and the applicable
        Rust or Node lint configuration, but it does not prove that the gate invokes the linter.
      - Do not tick a task whose test has not been run.
  archive:
    guidance:
      - Do not archive while any task is unticked. The openspec workflow fails on that in CI, and
        finding it there costs a round trip.
