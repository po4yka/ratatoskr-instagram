# The Instagram service's own stanza of the one reviewed NATS authorization file,
# `ratatoskr-platform/deploy/nats/ratatoskr.conf`, which is authoritative. This copy exists for the
# authorized-broker test, and the workspace check fails when the two diverge once comments,
# whitespace and the nkey token are ignored (XR-021 CONTRACTS.md sections S03 and R3-01). Do not
# merge it into a host file by hand.
#
# Only the non-secret public-nkey placeholder is replaced at deployment. The seed stays in
# `/etc/ratatoskr/instagram.nkey` and is named by `RATATOSKR__BUS__NKEY_SEED_PATH`.
#
# Instagram consumes the Edge-provisioned durables `ratatoskr_instagram_browser_capture` (commands
# stream) and `ratatoskr_instagram_deletion_acks` (events stream; it carries Knowledge's
# acknowledgement of a removal, CONTRACTS.md R5-11) and publishes its own facts and operation
# reports. It subscribes only to its own inbox prefix `_INBOX_instagram`, which the service sets
# with `custom_inbox_prefix` in `services/instagram-archive/src/nats_transport.rs`; a service built
# without the prefix cannot complete a JetStream request under this stanza. A denied publish is
# visible only in the NATS server log as a `Publish Violation`.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_INSTAGRAM_XXXXX
    permissions: {
        publish: {
            allow: [
                "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_instagram_browser_capture",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_instagram_browser_capture",
                "$JS.ACK.ratatoskr_commands.ratatoskr_instagram_browser_capture.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_instagram_deletion_acks",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_instagram_deletion_acks",
                "$JS.ACK.ratatoskr_events.ratatoskr_instagram_deletion_acks.>",
                "evt.platform.operation.reported.v1",
                "evt.social.source.captured.v1",
                "evt.social.source.updated.v1",
                "evt.social.source.removed.v1",
            ]
        }
        subscribe: { allow: ["_INBOX_instagram.>"] }
    }
}
